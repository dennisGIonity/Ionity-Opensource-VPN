name: ci
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: e2e against the mock node-agent
        run: |
          python3 tests/mock_node.py 8080 &
          sleep 1
          CHROMIUM=$(node -e "console.log(require('playwright').chromium.executablePath())") npm test
      - name: Build debug APK
        run: npm run build:apk-debug
      - name: Read back the APK (bundled web layer must match www/)
        run: |
          A=android/app/build/outputs/apk/debug/app-debug.apk
          test "$(unzip -p $A assets/public/index.html | sha256sum)" = "$(sha256sum < www/index.html)"
      - uses: actions/upload-artifact@v4
        with:
          name: ionity-opensource-vpn-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
